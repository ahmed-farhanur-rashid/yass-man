# ── EMBEDDER ──────────────────────────────────────────────────────────────────
# Embeds title+snippet for cosine-similarity clustering (near-duplicate removal).
# Alternatives:
#   multilingual-e5-small   → non-English queries
#   all-MiniLM-L6-v2        → lighter, slightly lower quality
#   bge-small-en-v1.5       → newer version of the default

embedder:
  model: bge-small-en
  source: huggingface
  repo: BAAI/bge-small-en
  backend: pytorch
  max_seq_length: 512
  batch_size: 32


# ── RERANKER ──────────────────────────────────────────────────────────────────
# Cross-encoder that scores (query, document) pairs. Most important ML component.
# Alternatives:
#   cross-encoder/ms-marco-MiniLM-L-6-v2   → fastest, lower accuracy
#   BAAI/bge-reranker-base                  → default, recommended
#   BAAI/bge-reranker-large                 → better accuracy, ~3x slower
#   BAAI/bge-reranker-v2-m3                 → multilingual, best quality

reranker:
  model: bge-reranker-base
  source: huggingface
  repo: BAAI/bge-reranker-base
  backend: pytorch
  max_seq_length: 512
  top_k: 10


# ── QUERY ROUTER ──────────────────────────────────────────────────────────────
# Classifies intent. Defaults to rule-based (no model, <10ms).
# Set mode: model and provide a repo to use a classifier instead.

router:
  mode: rule-based
  model: null
  repo: null


# ── LLM SYNTHESIS ─────────────────────────────────────────────────────────────
# Generates the final synthesized answer from top-K results.
# Uses llama-cpp-python to run GGUF models on CPU (or GPU if n_gpu_layers > 0).
# Set enabled: false to skip synthesis and return only ranked results.
#
# Alternatives (faster → better quality):
#   Qwen2.5-1.5B-Instruct-Q4_K_M.gguf     → default
#   Qwen2.5-3B-Instruct-Q4_K_M.gguf       → noticeably better
#   Phi-3-mini-4k-instruct-q4.gguf         → Microsoft, similar to Qwen 1.5B
#   gemma-2b-it-q4_k_m.gguf               → Google, good for factual answers
#   Mistral-7B-Instruct-v0.3.Q4_K_M.gguf  → much better, needs 6–8GB RAM
#   Llama-3.2-3B-Instruct-Q4_K_M.gguf    → strong 3B option

llm:
  enabled: true
  model: Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
  path: ./models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
  download_url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
  context_length: 4096
  max_answer_tokens: 512
  temperature: 0.3
  n_gpu_layers: 0        # Set to 35+ if you have a CUDA GPU (Windows/Linux)
  n_threads: null        # null = auto-detect
  max_sources_in_prompt: 8
  require_citations: true
  resolve_contradictions: true


# ── PIPELINE SETTINGS ─────────────────────────────────────────────────────────
pipeline:
  max_expanded_queries: 5
  search_timeout_seconds: 2
  dedup_similarity_threshold: 0.92
  embedding_cache: true
